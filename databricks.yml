# This is a Databricks asset bundle definition for databricks-terraform.
# The Databricks extension requires databricks.yml configuration file.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.

bundle:
  name: databricks-terraform

sync:
  include:
    - dist/

include:
  - jobs/*.yml

artifacts:
  src_module_whl:
    type: whl
    build: |
      rm -rf dist build *.egg-info
      python -m build
    path: .

variables:
  env:
    description: The environment
  cluster_id: 
    description: The existing cluster ID to run jobs on.
  catalog:
    description: The catalog the target is writing
  wheel_path:
    description: The path for the wheel artifact

targets:
  devjoo:
    mode: development
    default: true
    workspace:
      host: https://adb-7405609292883928.8.azuredatabricks.net/
    variables:
      cluster_id: 1220-211626-51nh68br
      catalog: test_catalog
      wheel_path: ../dist/*.whl
      env: dev


