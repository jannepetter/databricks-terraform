resources:
  jobs:
    my_job_with_existing_cluster:
      name: "my_job_with_existing_cluster"
      tasks:
        - task_key: main_task
          python_wheel_task:
            package_name: src_module
            entry_point: pipe1
            parameters: ["--catalog","${var.catalog}"]
          libraries: 
            - whl: ../dist/*.whl
          existing_cluster_id: ${var.cluster_id}